services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: sqlite:////data/restaurant.db
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env before starting}
    volumes:
      - restaurant_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:3000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  restaurant_data:
